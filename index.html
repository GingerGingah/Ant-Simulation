<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/style.css">
        <title>Ant Simulation</title>
    </head>

    <body>
        <div class="background-image"></div>
        <div class="content">
            <div id="Title">
                <h1>An Ant Simulation</h1>
                <hr>
            </div>
            <canvas id="Begin" width="800" height="600"></canvas>
            <div class="button-row">
                <button id="addAntBtn" style="width: 80px; height: 40px;">Add an Ant!</button>
                <button id="addManyAntBtn" style="width: 80px; height: 40px;">Add Many Ants!</button>
                <button id="deleteAntBtn" style="width: 80px; height: 40px;">Delete an Ant!</button>
                <button id="clearAntBtn" style="width: 80px; height: 40px;">Clear All Ants!</button>
                <button id="appleSpawnBtn" style="width: 80px; height: 40px;">Spawn an Apple!</button>
                <button id="togglePheroBtn" style="width: 90px; height: 40px;">Toggle Pheromones</button>
            </div>

            <script src="JS/functions.js"></script>
            <script src="JS/main.js"></script>
        </div>
    </body>
</html>
